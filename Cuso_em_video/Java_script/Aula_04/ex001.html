<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro programat</title>
    <style>
        body{
            background-color: rgb(178, 194, 194);
        }
        h1,p{
            color: rgb(20, 55, 85);
        }

    </style>
</head>
<body>
<h1>Olá, mundo!</h1>
<h2></h2>
<p>Me livrei da maldição</p>
<button id="btn" onclick="welcome()"></button>
    
</body>
<script>
    //window no começo é opcional!
    window.alert("Tudo é teste aqui, Calma!");
    confirm("Tá achando que é easy??");
    let info = prompt("Qual o seu nome?");
    
    let sacangem  = document.querySelector("h2");
    sacangem.textContent = info +" está peidando para o Aprendizado!";
    sacangem.style.color = "White";

//Criar o habito do ; sempre, aaaa mas não precisa, até parar de rodar
//Quase como um pulador de linha!

    function welcome(){
        let x = document.querySelector("h1")
        if (x.textContent == "Safe"){
            x.textContent = "Olá, mundo!";
            x.style.color = "Black" ;
            }
        else {
            x.textContent = "Safe";
            x.style.color = "Green" ;
        }
    };
</script>
</html>
