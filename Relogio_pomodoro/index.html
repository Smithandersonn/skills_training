<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Time-to-Study</title>
</head>

<body>
    <header>
        <button class="sw_color"></button>
    </header>
    <section >
        <h1 class="clock">00:00</h1>
        <main>
            <button class="modo">MODO</button>
            <button class="operacao">ESCOLHA</button>
            <button class="start_stop"></button>
            <input type="time" class="estudo" placeholder="ESTUDO">
            <input type="time" class="pausa" placeholder="PAUSA">
        </main>
    </section>
    <footer></footer>
    <script src="main.js"></script>
</body>
</html>
